[project]
name = "lecturebridge-ai"
version = "0.1.0"
description = "Evidence-grounded lecture accessibility and learning platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=23.2.1",
    "email-validator>=2.0.0",
    "fastapi>=0.110.0",
    "faster-whisper>=1.0.3",
    "ffmpeg-python>=0.2.0",
    "httpx>=0.27.0",
    "openai>=1.50.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.0.0",
    "alembic>=1.13.2",
    "psycopg[binary]>=3.2.1",
    "redis>=5.0.8",
    "rq>=1.16.2",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.16",
    "uvicorn>=0.29.0",
    "yt-dlp>=2024.3.10",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["src/backend/tests", "tests"]
norecursedirs = [".venv", "node_modules"]
